<script src="elements/data-hotwords.js"></script>

<script src="elements/interact.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var hwKeys=[],hwIdx=0;
  function renderHotwords(){
    var tabs=$('hwTabs'), cloud=$('hwCloud');
    if(!window.CGL_HOTWORDS){
      tabs.innerHTML=''; cloud.innerHTML='<p class="ph">暂未配置热搜词，请编辑 elements/data-hotwords.js</p>'; return;
    }
    hwKeys=Object.keys(CGL_HOTWORDS);
    var th='';
    for(var i=0;i<hwKeys.length;i++){
      th+='<span class="rtab'+(i===hwIdx?' on':'')+'" onclick="pickHw('+i+')">'+CGL.esc(hwKeys[i])+'</span>';
    }
    tabs.innerHTML=th;
    renderHwCloud(hwIdx);
  }
  window.pickHw=function(i){
    hwIdx=i;
    var tabs=$('hwTabs');
    var sp=tabs.querySelectorAll('.rtab');
    for(var k=0;k<sp.length;k++) sp[k].classList.toggle('on',k===i);
    renderHwCloud(i);
  };
  function renderHwCloud(i){
    var cloud=$('hwCloud');
    var list=(CGL_HOTWORDS[hwKeys[i]]||[]).slice(0,14);
    CGL.renderTags(cloud,list);
  }
  function renderNotices(){
    var el=$('noticeList');
    if(!window.CGL_NOTICES || !CGL_NOTICES.length){
      el.innerHTML='<p class="ph">暂未配置通知，请编辑 elements/data-notices.js</p>'; return;
    }
    CGL.renderNotices(el,CGL_NOTICES);
  }
  document.addEventListener('DOMContentLoaded',function(){renderHotwords();renderNotices();});
})();
</script>

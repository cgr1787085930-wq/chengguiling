      <span class="sec-sub">每个维度可 <b>单选一个词</b>，可跳过（跳过则标题不含该维度）</span>
    </div>
    <div class="card" id="dimRoot"><span class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 加载中...</span></div>

  <!-- 操作 -->
  <section class="sec reveal" style="padding-top:14px">

      <button type="button" class="btn gold" onclick="doRandom()">🎲 随机组合</button>
      <button type="button" class="btn ghost" onclick="doClear()">清空选择</button>

      <li style="border-style:dashed;cursor:default"><span class="gidx">i</span><span class="gtxt ph">选择词后点击「生成标题」，中英文标题将显示在这里</span></li>

<script src="elements/data-title-words.js"></script>
<script src="elements/common.js"></script>
<script>
(function(){
  var CATS=window.CGL_TITLE_WORDS||{};
  var catKeys=Object.keys(CATS);
  var curCat=catKeys[0]||'';
  var sel={};        // dim -> idx
  var genItems=[];   // [{cn,en}]

  var $=function(id){return document.getElementById(id);};

  /* 中英文占位符映射：英文模板键 -> 中文维度名 */
  var EN2DIM={
    style:'风格',pattern:'图案',color:'颜色',fabric:'材质',collar:'领型',
    sleeve:'袖长',category:'品类词',scene:'场景',fit:'版型',age:'年龄段',
    gender:'性别',season:'季节',detail:'细节特征',func:'功能特性',
    waist:'腰型',length:'长度',event:'节日活动',crowd:'人群'
  };

  function renderCatTabs(){
    var h='';
    for(var i=0;i<catKeys.length;i++){
      h+='<span class="rtab'+(i===0?' on':'')+'" onclick="pickCat(\''+catKeys[i]+'\')">'+CGL.esc(catKeys[i])+'</span>';
    }
    $('catTabs').innerHTML=h;
  }
  window.pickCat=function(c){
    curCat=c;
    var sp=$('catTabs').querySelectorAll('.rtab');
    for(var k=0;k<sp.length;k++) sp[k].classList.toggle('on',sp[k].textContent===c);
    sel={};
    renderDims();
  };

  function renderDims(){
    var cfg=CATS[curCat];
    if(!cfg){ $('dimRoot').innerHTML='<p class="ph">该品类未配置词库</p>'; return; }
    var h='';
    for(var d=0;d<cfg.order.length;d++){
      var dn=cfg.order[d];
      var words=cfg.dims[dn]||[];
      h+='<div class="dimbox"><div class="dimhead"><span class="dname">'+CGL.esc(dn)+'</span><span class="dcount">'+words.length+' 词</span></div><div class="wbtns">';
      for(var w=0;w<words.length;w++){
        var on=(sel[dn]===w)?' on':'';
        h+='<button type="button" class="wbtn'+on+'" data-dim="'+CGL.esc(dn)+'" data-idx="'+w+'">'+
           CGL.esc(words[w].cn)+'<small>'+CGL.esc(words[w].en)+'</small></button>';
      }
      h+='</div></div>';
    }
    $('dimRoot').innerHTML=h;

    var btns=$('dimRoot').querySelectorAll('.wbtn');
    for(var b=0;b<btns.length;b++){
      (function(btn){
        btn.addEventListener('click',function(){
          var dn=btn.getAttribute('data-dim');
          var idx=Number(btn.getAttribute('data-idx'));
          if(sel[dn]===idx){
            delete sel[dn];
            btn.classList.remove('on');
          }else{
            sel[dn]=idx;
            var same=$('dimRoot').querySelectorAll('.wbtn[data-dim="'+dn+'"]');
            for(var s=0;s<same.length;s++) same[s].classList.remove('on');
            btn.classList.add('on');
          }
          updateSelCount();
        });
      })(btns[b]);
    }
    updateSelCount();
  }

  function updateSelCount(){
    var n=Object.keys(sel).length;
    $('selCount').textContent= n>0 ? ('已选 '+n+' 个维度') : '';
  }

  function pickWord(dn){
    var words=CATS[curCat].dims[dn];
    if(!words||!words.length) return null;
    return words[Math.floor(Math.random()*words.length)];
  }

  function build(){
    var cfg=CATS[curCat];
    var cn=cfg.cnTemplate, en=cfg.enTemplate;
    var picked={};
    for(var d=0;d<cfg.order.length;d++){
      var dn=cfg.order[d];
      var w = (sel[dn]!==undefined)? cfg.dims[dn][sel[dn]] : null;
      if(w) picked[dn]=w;
    }
    /* 中文模板替换 */
    for(var k in picked){
      cn=cn.split('{'+k+'}').join(picked[k].cn);
    }
    /* 英文模板替换 */
    for(var ek in EN2DIM){
      var dn2=EN2DIM[ek];
      if(picked[dn2]) en=en.split('{'+ek+'}').join(picked[dn2].en);
    }
    /* 清理未替换占位符与多余空格 */
    cn=cn.replace(/\{[^}]*\}/g,'').replace(/[　 ]+/g,' ').replace(/^[ 　]+|[ 　]+$/g,'');
    en=en.replace(/\{[^}]*\}/g,'').replace(/\s+/g,' ').trim();
    return {cn:cn,en:en};
  }

  window.doGenerate=function(){
    var r=build();
    if(!r.cn && !r.en){
      CGL.toast('请先选择至少一个维度的词');
      return;
    }
    genItems.unshift(r);
    if(genItems.length>10) genItems.pop();
    renderGen();
  };

  window.doRandom=function(){
    var cfg=CATS[curCat];
    sel={};
    for(var d=0;d<cfg.order.length;d++){
      sel[cfg.order[d]]=Math.floor(Math.random()*cfg.dims[cfg.order[d]].length);
    }
    renderDims();
    window.doGenerate();
  };

  window.doClear=function(){
    sel={};
    renderDims();
    CGL.toast('已清空选择');
  };

  function renderGen(){
    var ul=$('genList');
    var h='';
    for(var i=0;i<genItems.length;i++){
      var it=genItems[i];
      h+='<li><span class="gidx">'+(i+1)+'</span>'+
         '<span class="gtxt"><span class="cn">'+CGL.esc(it.cn)+'</span><br><span class="en">'+CGL.esc(it.en)+'</span></span>'+
         '<span class="gacts">'+
         '<button type="button" class="btn sm accent" onclick="copyGen('+i+',0)">复制中英</button>'+
         '<button type="button" class="btn sm ghost" onclick="copyGen('+i+',1)">复制中文</button>'+
         '<button type="button" class="btn sm ghost" onclick="copyGen('+i+',2)">复制英文</button>'+
         '</span></li>';
    }
    ul.innerHTML=h || '<li style="border-style:dashed"><span class="gidx">i</span><span class="gtxt ph">暂无生成记录</span></li>';
  }

  window.copyGen=function(i,type){
    var it=genItems[i];
    if(!it) return;
    var txt= type===1?it.cn : (type===2?it.en : (it.cn+' | '+it.en));
    CGL.copyText(txt);
  };

  document.addEventListener('DOMContentLoaded',function(){
    if(!catKeys.length){
      $('catTabs').innerHTML='<p class="ph">未找到词库文件 elements/data-title-words.js</p>';
      return;
    }
    renderCatTabs();
    renderDims();
  });
})();
</script>
</body>
